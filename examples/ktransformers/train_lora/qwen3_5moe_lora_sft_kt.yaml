### model
model_name_or_path: Qwen/Qwen3.5-397B-A17B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: identity, alpaca_en_demo
template: qwen3_5
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/KT_FT_qwen35Moe
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### ktransformers
use_kt: true
# CPU AMX BF16/frozen INT8/FP8 only; omit for INT4, GPU, or Hybrid paths.
# kt_cpu_activation: retain
# Use examples/ktransformers/accelerate/fsdp2_kt_qwen3_5.yaml; change its backend for INT8/INT4 weights.
# Tune cutoff_len and kt_model_max_length together for the 397B path.
# kt_weight_path: /path/to/Qwen3.5-MoE-AMXINT8
